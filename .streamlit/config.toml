[browser]
gatherUsageStats = false

[theme]
base = "light"
# Mirrors ui_theme.py for native widgets and tables.
primaryColor = "#AD5435"
backgroundColor = "#F8F6F2"
secondaryBackgroundColor = "#F2EDE6"
textColor = "#352A24"
borderColor = "#E6DED4"
showWidgetBorder = true
dataframeBorderColor = "#E6DED4"
dataframeHeaderBackgroundColor = "#F2EDE6"
baseFontSize = 15
baseRadius = "small"
buttonRadius = "small"
font = 'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
headingFont = 'ui-serif, Georgia, Cambria, "Times New Roman", Times, serif'

# Keep native informational/validation messages in the same restrained palette.
blueColor = "#75695D"
blueBackgroundColor = "#F2EDE6"
blueTextColor = "#75695D"
greenColor = "#5D7D63"
greenBackgroundColor = "#EDF2EB"
greenTextColor = "#526D55"
redColor = "#994D44"
redBackgroundColor = "#F7E8E3"
redTextColor = "#994D44"
yellowColor = "#A87334"
yellowBackgroundColor = "#F5EBDC"
yellowTextColor = "#805721"
